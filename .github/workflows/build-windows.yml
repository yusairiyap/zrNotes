name: Build Windows Executable

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath zrnotes-windows.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: zrnotes-windows-zip-${{ github.run_number }}
          path: zrnotes-windows.zip
          retention-days: 30

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: iscc windows\installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: zrnotes-windows-installer-${{ github.run_number }}
          path: Output/zrnotes-setup.exe
          retention-days: 30
